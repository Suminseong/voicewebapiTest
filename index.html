<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Speech API with Grammar</title>
</head>

<body>
    <div>
        <h1>Web Speech API Demo</h1>
        <p>Status: <span id="status">WAITING</span></p>
        <p>Final: <span id="final"></span></p>
        <button id="start-btn">Start</button>
        <button id="stop-btn">Stop</button>
    </div>

    <script>
        if ("webkitSpeechRecognition" in window) {
            let speechRecognition = new webkitSpeechRecognition();
            let speechGrammarList = new webkitSpeechGrammarList();

            // Grammar 정의
            const grammar = "#JSGF V1.0; grammar colors; public <color> = 빨강 | 파랑 | 초록 ;";
            speechGrammarList.addFromString(grammar, 1);

            // SpeechRecognition에 grammar 설정
            speechRecognition.grammars = speechGrammarList;
            speechRecognition.continuous = false;
            speechRecognition.interimResults = false;

            speechRecognition.onstart = () => {
                document.getElementById("status").textContent = "START";
            };

            speechRecognition.onend = () => {
                document.getElementById("status").textContent = "WAITING";
            };

            speechRecognition.onresult = (event) => {
                const color = event.results[0][0].transcript.trim();
                document.getElementById("final").textContent = color;

                // 배경색 변경
                if (color === "빨강") {
                    document.body.style.backgroundColor = "red";
                } else if (color === "파랑") {
                    document.body.style.backgroundColor = "blue";
                } else if (color === "초록") {
                    document.body.style.backgroundColor = "green";
                } else {
                    alert("지원하지 않는 색입니다!");
                }
            };

            speechRecognition.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
            };

            document.getElementById("start-btn").addEventListener("click", () => {
                speechRecognition.start();
            });

            document.getElementById("stop-btn").addEventListener("click", () => {
                speechRecognition.stop();
            });
        } else {
            console.error("Web Speech API 또는 GrammarList가 지원되지 않는 브라우저입니다.");
        }
    </script>
</body>

</html>
